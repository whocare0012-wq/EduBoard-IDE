name: Source checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Temporary until the initial generated lockfile is committed.
      - name: Install development dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Bundle desktop sources
        run: npm run build
