name: Source checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install development dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Bundle desktop sources
        run: npm run build
      - name: Unit checks
        run: npm test
      - name: Windows desktop workflow
        if: runner.os == 'Windows'
        run: npm run test:desktop
      - name: Windows development startup
        if: runner.os == 'Windows'
        run: npm run test:dev
      - name: Blockly project workflow
        if: runner.os == 'Windows'
        run: npm run test:blocks
      - name: Three-mode project workflow
        if: runner.os == 'Windows'
        run: npm run test:modes
      - name: MicroPython software workflow
        if: runner.os == 'Windows'
        run: npm run test:python
      - name: Editing state and adaptive panels
        if: runner.os == 'Windows'
        run: npm run test:workspace
      - name: Generated Python syntax
        run: npm run test:python-examples
      - name: Diagnostic markers and navigation
        if: runner.os == 'Windows'
        run: npm run test:diagnostics
      - name: Save-and-continue workflow
        if: runner.os == 'Windows'
        run: npm run test:unsaved
      - name: Build unsigned Windows preview
        if: runner.os == 'Windows'
        # The checks above already ran; rebuild (test:dev rewrites out/) and package without repeating `npm run check`.
        run: npm run package:win:fast
      - name: Packaged desktop workflow
        if: runner.os == 'Windows'
        run: npm run test:desktop
        env:
          EDUBOARD_SMOKE_EXE: '${{ github.workspace }}/release/win-unpacked/EduBoard IDE.exe'
      - name: Packaged three-mode workflow
        if: runner.os == 'Windows'
        run: npm run test:modes
        env:
          EDUBOARD_SMOKE_EXE: '${{ github.workspace }}/release/win-unpacked/EduBoard IDE.exe'
      - name: Packaged Python workflow
        if: runner.os == 'Windows'
        run: npm run test:python
        env:
          EDUBOARD_SMOKE_EXE: '${{ github.workspace }}/release/win-unpacked/EduBoard IDE.exe'
      - name: Packaged editing state and panels
        if: runner.os == 'Windows'
        run: npm run test:workspace
        env:
          EDUBOARD_SMOKE_EXE: '${{ github.workspace }}/release/win-unpacked/EduBoard IDE.exe'
      - name: Packaged diagnostics
        if: runner.os == 'Windows'
        run: npm run test:diagnostics
        env:
          EDUBOARD_SMOKE_EXE: '${{ github.workspace }}/release/win-unpacked/EduBoard IDE.exe'
      - name: Packaged save-and-continue workflow
        if: runner.os == 'Windows'
        run: npm run test:unsaved
        env:
          EDUBOARD_SMOKE_EXE: '${{ github.workspace }}/release/win-unpacked/EduBoard IDE.exe'
      - name: Save preview installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-unsigned-preview
          path: release/*-Setup.exe
          retention-days: 7
