name: Source checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Bundle desktop sources
        run: npm run build
      - name: Unit checks
        run: npm test
      - name: Windows desktop workflow
        if: runner.os == 'Windows'
        run: npm run test:desktop
      - name: Windows development startup
        if: runner.os == 'Windows'
        run: npm run test:dev
      - name: Build unsigned Windows preview
        if: runner.os == 'Windows'
        run: npm run package:win
      - name: Packaged desktop workflow
        if: runner.os == 'Windows'
        run: npm run test:desktop
        env:
          EDUBOARD_SMOKE_EXE: '${{ github.workspace }}/release/win-unpacked/EduBoard IDE.exe'
      - name: Save preview installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-unsigned-preview
          path: release/*-Setup.exe
          retention-days: 7
